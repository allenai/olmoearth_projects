name: Satlas-Prediction

on:
  workflow_dispatch:

env:
  BEAKER_IMAGE_NAME: "satlas_deploy"
  BEAKER_IMAGE_FULL_NAME: "favyen/satlas_deploy"
  BEAKER_TOKEN: ${{ secrets.BEAKER_TOKEN }}
  BEAKER_ADDR: ${{ secrets.BEAKER_ADDR }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_start_beaker_jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Avoid issues with running out of disk space.
      - name: Cleanup disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      # Setup Beaker CLI.
      - name: Setup Beaker
        uses: allenai/setup-beaker@v2
        with:
          token: ${{ env.BEAKER_TOKEN }}
          workspace: "ai2/earth-systems"

      # Build Docker image.
      - name: Build Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.BEAKER_IMAGE_NAME }}

      # Upload the image to Beaker.
      - name: Create Beaker Image
        run: |
          beaker image delete "$BEAKER_IMAGE_FULL_NAME" || true
          beaker image create --name "$BEAKER_IMAGE_NAME" "$BEAKER_IMAGE_NAME"

      # Launch Beaker jobs (one per application).
      - name: Start Satlas prediction jobs
        run: |
          docker run --rm \
            -e BEAKER_TOKEN="${BEAKER_TOKEN}" \
            -e BEAKER_ADDR="${BEAKER_ADDR}" \
            "$BEAKER_IMAGE_NAME" \
            python -m olmoearth_projects.projects.satlas.deploy.start_beaker_job
