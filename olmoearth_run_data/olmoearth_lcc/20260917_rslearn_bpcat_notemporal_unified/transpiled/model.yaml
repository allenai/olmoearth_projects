model:
  class_path: olmoearth_run.runner.models.raster_input_lightning_module.RasterInputLightningModule
  init_args:
    model:
      class_path: rslearn.models.multitask.MultiTaskModel
      init_args:
        encoder:
        - class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
          init_args:
            patch_size: 4
            model_id: OLMOEARTH_V1_2_BASE
            embedding_size: 768
            autocast_dtype: float32
            use_register_bottleneck_output: false
            use_legacy_timestamps: false
            token_pooling: false
        decoders:
          binary:
          - class_path: rslearn.models.breakpoint_scan.BreakpointScan
            init_args:
              in_dim: 768
              output: EVIDENCE
              hidden: 256
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 64
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 64
              out_channels: 3
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          pre_change:
          - class_path: rslearn.models.breakpoint_scan.BreakpointScan
            init_args:
              in_dim: 768
              output: BEFORE_AFTER
              hidden: 256
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 1536
              out_channels: 768
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 11
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          post_change:
          - class_path: rslearn.models.breakpoint_scan.BreakpointScan
            init_args:
              in_dim: 768
              output: BEFORE_AFTER
              hidden: 256
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 1536
              out_channels: 768
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 15
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          src:
          - class_path: rslearn.models.breakpoint_scan.BreakpointScan
            init_args:
              in_dim: 768
              output: BEFORE
              hidden: 256
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 768
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 13
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          dst:
          - class_path: rslearn.models.breakpoint_scan.BreakpointScan
            init_args:
              in_dim: 768
              output: AFTER
              hidden: 256
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 768
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 768
              out_channels: 256
              kernel_size: 3
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 2
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 256
              out_channels: 128
              kernel_size: 3
          - class_path: rslearn.models.conv.Conv
            init_args:
              in_channels: 128
              out_channels: 13
              kernel_size: 1
              activation:
                class_path: torch.nn.Identity
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          ts_start:
          - class_path: rslearn.models.tokens_to_channels.TokensToChannels
            init_args:
              in_dim: 768
              out_dim: 1
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 4
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
          ts_end:
          - class_path: rslearn.models.tokens_to_channels.TokensToChannels
            init_args:
              in_dim: 768
              out_dim: 1
          - class_path: rslearn.models.upsample.Upsample
            init_args:
              scale_factor: 4
          - class_path: rslearn.train.tasks.segmentation.SegmentationHead
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: <dataset_path>
    batch_size: 32
    num_workers: 4
    inputs:
      sentinel2_l2a:
        data_type: raster
        layers:
        - sentinel2_l2a_lookbehind_0
        - sentinel2_l2a_lookbehind_0.1
        - sentinel2_l2a_lookbehind_0.2
        - sentinel2_l2a_lookbehind_0.3
        - sentinel2_l2a_lookbehind_0.4
        - sentinel2_l2a_lookbehind_0.5
        - sentinel2_l2a_lookbehind_0.6
        - sentinel2_l2a_lookbehind_0.7
        - sentinel2_l2a_lookbehind_0.8
        - sentinel2_l2a_lookbehind_0.9
        - sentinel2_l2a_lookbehind_0.10
        - sentinel2_l2a_lookbehind_0.11
        - sentinel2_l2a_lookbehind_0.12
        - sentinel2_l2a_lookbehind_0.13
        - sentinel2_l2a_lookbehind_0.14
        - sentinel2_l2a_lookbehind_0.15
        - sentinel2_l2a_lookbehind_1
        - sentinel2_l2a_lookbehind_1.1
        - sentinel2_l2a_lookbehind_1.2
        - sentinel2_l2a_lookbehind_1.3
        - sentinel2_l2a_lookbehind_1.4
        - sentinel2_l2a_lookbehind_1.5
        bands:
        - B02
        - B03
        - B04
        - B08
        - B05
        - B06
        - B07
        - B8A
        - B11
        - B12
        - B01
        - B09
        dtype: FLOAT32
        passthrough: true
        load_all_layers: true
        is_target: false
    task:
      class_path: rslearn.train.tasks.multi_task.MultiTask
      init_args:
        tasks:
          binary:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 3
          pre_change:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 11
          post_change:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 15
          src:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 13
          dst:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 13
          ts_start:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 22
          ts_end:
            class_path: rslearn.train.tasks.segmentation.SegmentationTask
            init_args:
              num_classes: 22
        input_mapping:
          binary: {}
          pre_change: {}
          post_change: {}
          src: {}
          dst: {}
          ts_start: {}
          ts_end: {}
    default_config:
      crop_size: 64
      transforms:
      - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
        init_args:
          band_names:
            sentinel2_l2a:
            - B02
            - B03
            - B04
            - B08
            - B05
            - B06
            - B07
            - B8A
            - B11
            - B12
            - B01
            - B09
    predict_config:
      load_all_crops: true
      skip_targets: true
      overlap_pixels: 16
      output_layer_name_skip_inference_if_exists: output
trainer:
  callbacks:
  - class_path: olmoearth_run.runner.callbacks.model_metrics.ModelMetricsCallback
  - class_path: olmoearth_run.runner.callbacks.multi_field_writer.MultiFieldInstrumentedWriter
    init_args:
      path: <dataset_path>
      output_layer: output
      merger:
        class_path: rslearn.train.prediction_writer.RasterMerger
        init_args:
          overlap_pixels: 16
          downsample_factor: 1
      fields:
      - binary
      - pre_change
      - post_change
      - src
      - dst
      - ts_start
      - ts_end
  - class_path: olmoearth_run.runner.callbacks.predict_progress.PredictProgressCallback
  strategy: auto
