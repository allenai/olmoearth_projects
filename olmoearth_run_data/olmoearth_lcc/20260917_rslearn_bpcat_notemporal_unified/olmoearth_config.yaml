      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 1536
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 15
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
