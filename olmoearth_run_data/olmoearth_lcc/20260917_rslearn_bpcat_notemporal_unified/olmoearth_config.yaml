model:
  encoder:
    name: olmoearth
    patch_size: 4
    output: patch_tokens
    use_legacy_timestamps: false
    token_pooling: false
    source:
      name: huggingface
      model_id: OLMOEARTH_V1_2_BASE
  tasks:
    binary:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: EVIDENCE
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 64
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 64
          out_channels: 3
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 3
    pre_change:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: BEFORE_AFTER
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 1536
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 11
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 11
    post_change:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: BEFORE_AFTER
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 1536
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 15
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 15
    src:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: BEFORE
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 13
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 13
    dst:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: AFTER
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 13
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 13
    ts_start:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.tokens_to_channels.TokensToChannels
        init_args:
          in_dim: 768
          out_dim: 1
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 4
      - class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepHead
        init_args:
          input_key: sentinel2_l2a
          mode: AFTER
      task:
        class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepTask
        init_args:
          num_classes: 22
    ts_end:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.tokens_to_channels.TokensToChannels
        init_args:
          in_dim: 768
          out_dim: 1
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 4
      - class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepHead
        init_args:
          input_key: sentinel2_l2a
          mode: AFTER
      task:
        class_path: rslearn.train.tasks.per_pixel_timestep.PerPixelTimestepTask
        init_args:
          num_classes: 22
input_preprocessing:
  default:
    input_size: 64
    input_mode: all_tiles
  predict:
    overlap_pixels: 16
prediction_requests:
  partitioners:
    request_to_partitions:
      name: grid
      grid_size: 1.0
      overlap_size: 0.0
      projection: null
    partition_to_windows:
      name: grid
      grid_size: 2048
      overlap_size: 0.0
      projection:
        method: use_utm
  postprocessors:
    additional_steps:
    - name: vectorize
      field: post_change
      skip_label_ids:
      - 0
      - 1
      auxiliary_fields:
        binary:
          aggregation: mode
        pre_change:
          aggregation: mode
        src:
          aggregation: mode
        dst:
          aggregation: mode
        ts_start:
          aggregation: percentile
          percentile: 10
        ts_end:
          aggregation: percentile
          percentile: 90
transpiler_context:
  downsample_factor: 1
