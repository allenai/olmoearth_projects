model:
  encoder:
    name: olmoearth
    patch_size: 4
    output: patch_tokens
    use_legacy_timestamps: false
    token_pooling: false
    source:
      name: huggingface
      model_id: OLMOEARTH_V1_2_BASE
  tasks:
    binary:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: EVIDENCE
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 64
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 64
          out_channels: 3
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 3
    pre_change:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: BEFORE_AFTER
          hidden: 256
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 1536
          out_channels: 768
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 768
          out_channels: 256
          kernel_size: 3
      - class_path: rslearn.models.upsample.Upsample
        init_args:
          scale_factor: 2
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 256
          out_channels: 128
          kernel_size: 3
      - class_path: rslearn.models.conv.Conv
        init_args:
          in_channels: 128
          out_channels: 11
          kernel_size: 1
          activation:
            class_path: torch.nn.Identity
      - class_path: rslearn.train.tasks.segmentation.SegmentationHead
      task:
        class_path: rslearn.train.tasks.segmentation.SegmentationTask
        init_args:
          num_classes: 11
    post_change:
      name: manual
      decoder_layers:
      - class_path: rslearn.models.breakpoint_scan.BreakpointScan
        init_args:
          in_dim: 768
          output: BEFORE_AFTER
