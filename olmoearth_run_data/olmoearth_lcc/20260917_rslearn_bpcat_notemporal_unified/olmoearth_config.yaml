input_preprocessing:
  default:
    input_size: 64
    input_mode: all_tiles
  predict:
    overlap_pixels: 16
prediction_requests:
  partitioners:
    request_to_partitions:
      name: grid
      grid_size: 1.0
      overlap_size: 0.0
      projection: null
    partition_to_windows:
      name: grid
      grid_size: 2048
      overlap_size: 0.0
      projection:
        method: use_utm
  postprocessors:
    additional_steps: []
transpiler_context:
  downsample_factor: 1
