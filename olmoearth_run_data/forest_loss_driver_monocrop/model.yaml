model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.singletask.SingleTaskModel
      init_args:
        encoder:
          - class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
            init_args:
              model_id: OLMOEARTH_V1_2_BASE
              patch_size: 4
              # The model is trained with real timestamps so that it can tell apart the
              # pre-loss and post-loss months in the input stack.
              use_legacy_timestamps: false
        decoder:
          # Window classification with max pooling over the whole feature map,
          # followed by a single linear layer.
          - class_path: rslearn.models.pooling_decoder.PoolingDecoder
            init_args:
              in_channels: 768
              out_channels: 7
          - class_path: rslearn.train.tasks.classification.ClassificationHead
    optimizer:
      class_path: rslearn.models.olmoearth_pretrain.optimizer.LayerDecayAdamW
      init_args:
        lr: 0.0001
        layer_decay_rate: 0.8
        num_layers: 12
        encoder_prefix: model.encoder.0
    scheduler:
      class_path: rslearn.train.scheduler.PlateauScheduler
      init_args:
        factor: 0.2
        patience: 2
        min_lr: 0
        cooldown: 10
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: ${DATASET_PATH}
    inputs:
      sentinel2_l2a:
        data_type: raster
        # The sentinel2_l2a layer contains 12 monthly mosaics (one item group per
        # 30-day period across the 360-day window time range), which we load as the
        # 12 timesteps for the model.
        layers: [sentinel2_l2a]
        bands: [B02, B03, B04, B08, B05, B06, B07, B8A, B11, B12, B01, B09]
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true
        load_all_item_groups: true
      targets:
        data_type: vector
        layers: [label_vector]
        is_target: true
    task:
      class_path: rslearn.train.tasks.classification.ClassificationTask
      init_args:
        property_name: class_name
        # nodata (0) is never a label; it is kept so class indices line up with the
        # training configuration.
        classes: [nodata, mennonites_nonsoybean, soybean, oil_palm, other_agriculture, pastures, rice]
        metric_kwargs:
          average: micro
        prob_property: probs
        enable_confusion_matrix: true
    batch_size: 4
    num_workers: ${NUM_WORKERS}
    default_config:
      transforms:
        # Ensure every input is exactly 128x128 so the batch can be stacked. Windows
        # centered just north of the equator can come out one pixel short in older
        # versions of olmoearth_run (the window bounds straddle y=0 in the UTM pixel
        # coordinate system and truncate in opposite directions).
        - class_path: rslearn.train.transforms.pad.Pad
          init_args:
            mode: center
            size: 128
            image_selectors:
              - sentinel2_l2a
        - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
          init_args:
            band_names:
              sentinel2_l2a: [B02, B03, B04, B08, B05, B06, B07, B8A, B11, B12, B01, B09]
    train_config:
      tags:
        split: train
    val_config:
      tags:
        split: val
    test_config:
      tags:
        split: val
    predict_config:
      skip_targets: true
trainer:
  max_epochs: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: rslearn.train.callbacks.checkpointing.BestLastCheckpoint
      init_args:
        dirpath: ${TRAINER_DATA_PATH}
        monitor: val_accuracy
        mode: max
    - class_path: rslearn.train.prediction_writer.RslearnWriter
      init_args:
        path: ${DATASET_PATH}
        output_layer: ${PREDICTION_OUTPUT_LAYER}
